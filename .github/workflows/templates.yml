name: templates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  run-templates:
    name: Run every template
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute all templates
        # Agg keeps matplotlib from blocking on plt.show() with no display attached.
        env:
          MPLBACKEND: Agg
        run: |
          failed=0
          for f in $(find . -name "*.py" | sort); do
            echo "::group::$f"
            if timeout 300 python "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f::Template failed to execute"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
